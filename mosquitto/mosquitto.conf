persistence true
persistence_location /mosquitto/data/
log_dest stdout
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwords

# Limit retained/offline data on the broker. Topic-level ACLs can replace this password-only
# setup when individual gateways receive separate identities during hardware commissioning.
max_queued_messages 1000
message_size_limit 262144
