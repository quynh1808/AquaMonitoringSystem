[platformio]
; The existing ESP-IDF project keeps its application component in main/.
default_envs = aquaops_sensor_node
src_dir = main

[env:aquaops_sensor_node]
; Pin the platform so every workstation receives the same ESP-IDF/toolchain set.
platform = platformio/espressif32@7.0.1
; ESP32-WROOM-32E development boards normally expose a 4 MB ESP32 module.
board = esp32dev
framework = espidf

; ESP-IDF console defaults to 115200. Lower upload speed to 115200 if a USB-UART
; adapter or long cable is unstable at 460800.
monitor_speed = 115200
upload_speed = 460800

; This project reserves a large NVS region for provisioning and offline records.
board_build.partitions = partitions.csv
