name: aquaops

services:
  postgresql:
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquaculture_monitoring}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_USERNAME: ${POSTGRES_APP_USERNAME:?set POSTGRES_APP_USERNAME in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./secrets/mosquitto_passwords:/mosquitto/config/passwords:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 4 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  data-protection-init:
    image: ${BUSYBOX_IMAGE:-busybox:1.37}
    restart: "no"
    user: "0:0"
    # Named volumes start as root-owned. This one-shot service grants only the non-root AquaOps
    # identity access before ASP.NET creates antiforgery and cookie-encryption keys.
    command:
      - sh
      - -c
      - >-
        chown -R ${AQUAOPS_CONTAINER_UID:-1654}:${AQUAOPS_CONTAINER_GID:-1654} /keys &&
        chmod 700 /keys
    volumes:
      - data_protection_keys:/keys
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]

  aquaops:
    image: ${AQUAOPS_IMAGE:-ghcr.io/quynh1808/aquaops}:${AQUAOPS_VERSION:?set AQUAOPS_VERSION in .env}
    restart: unless-stopped
    init: true
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
      mosquitto:
        condition: service_healthy
      data-protection-init:
        condition: service_completed_successfully
    # Must match ContainerUser in AquacultureMonitoring.csproj and the init service above.
    user: "${AQUAOPS_CONTAINER_UID:-1654}:${AQUAOPS_CONTAINER_GID:-1654}"
    # Publish HTTP only on the selected LAN interface. For the narrowest exposure, set
    # AQUAOPS_BIND_ADDRESS to the Ubuntu server's fixed LAN IPv4 instead of 0.0.0.0.
    ports:
      - "${AQUAOPS_BIND_ADDRESS:?set AQUAOPS_BIND_ADDRESS in .env}:${AQUAOPS_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      DataProtection__KeysPath: /var/lib/aquaops/keys
      PostgreSql__Host: postgresql
      PostgreSql__Port: 5432
      PostgreSql__DatabaseName: ${POSTGRES_DB:-aquaculture_monitoring}
      PostgreSql__Username: ${POSTGRES_APP_USERNAME}
      PostgreSql__Password: ${POSTGRES_APP_PASSWORD}
      PostgreSql__CommandTimeoutSeconds: 30
      PostgreSql__AutoMigrate: "true"
      Authentication__BootstrapAdminUsername: ${AQUAOPS_ADMIN_USERNAME:?set AQUAOPS_ADMIN_USERNAME in .env}
      Authentication__BootstrapAdminPassword: ${AQUAOPS_ADMIN_PASSWORD:?set AQUAOPS_ADMIN_PASSWORD in .env}
      Authentication__BootstrapAdminDisplayName: ${AQUAOPS_ADMIN_DISPLAY_NAME:-Quản trị hệ thống}
      OperationalMode__Mode: ${AQUAOPS_MODE:-EdgeSimulation}
      AlertNotifications__Enabled: ${ALERT_WEBHOOK_ENABLED:-false}
      AlertNotifications__WebhookUrl: ${ALERT_WEBHOOK_URL:-}
      DeviceControl__HardwareControlEnabled: ${HARDWARE_CONTROL_ENABLED:-false}
    volumes:
      - data_protection_keys:/var/lib/aquaops/keys
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [lan, backend]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  lan:
  backend:
    internal: true

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
  data_protection_keys:
